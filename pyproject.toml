[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hotwell-bench"
version = "0.1.0.dev0"
description = "24-hour fault-identification benchmark generated from the hotwell plant simulator"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alan McIntyre" }]
dependencies = [
    # The simulator, pinned to a release tag and never edited from here.
    "hotwell @ git+https://github.com/CodeReclaimers/hotwell@v0.4.0",
    # numpy is part of hotwell's determinism contract (hotwell HANDOFF D21):
    # Generator.normal() is not promised stable across numpy releases.
    "numpy==2.5.1",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "matplotlib"]  # matplotlib: scripts/ only

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running runs (excluded by default; pytest -m slow)"]
addopts = "-m 'not slow'"
